services:
  payload:
    image: node:22-alpine
    ports:
      - "3123:3000"
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev"
    env_file:
      - .env

volumes:
  node_modules: